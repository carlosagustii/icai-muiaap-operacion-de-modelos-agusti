[project]
name = "aemet-requests"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "carlosagustii", email = "carlosacanga03@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.34.2",
]

[project.scripts]
aemet-requests = "aemet_requests:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
