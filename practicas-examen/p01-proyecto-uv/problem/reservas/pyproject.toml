[project]
name = "reservas"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "carlosagustii", email = "carlosacanga03@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6.0",
    "pandas>=3.1.1",
    "pytest>=9.2.0",
    "scikit-learn>=1.9.1",
]

[project.scripts]
reservas = "reservas:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
